<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7cc6f2">
<meta name="description" content="🌱 Grow a Garden ES — Tu granja online: planta, muta, recolecta y hazte rico. Funciona sin conexión y guarda tu progreso.">
<title>🌱 Grow a Garden ES</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- ============ CAPA DE INTERFAZ ============ -->
<div id="hud">
  <div class="chip">🪙 <b id="coins">0</b></div>
  <div class="chip" id="lvlChip"><span id="lvlBadge">Nv 1</span>
    <div class="xpbar"><i id="xpfill"></i></div>
  </div>
  <button class="chip btnish" id="rbChip" title="Renacimientos (+25% de valor por renacimiento)">⭐ <b id="rbCount">0</b></button>
</div>

<button id="weatherChip" title="El clima otorga mutaciones especiales a los cultivos maduros">
  <span id="wName">☀️ Soleado</span> <b id="wTime">0:00</b>
</button>

<button id="questChip" title="Tus misiones activas">📜 …</button>

<div id="menu">
  <button class="mbtn" id="btnShop">🛒<span>Tienda</span></button>
  <button class="mbtn" id="btnPets">🐾<span>Mascotas</span></button>
  <button class="mbtn" id="btnQuests">📜<span>Misiones</span></button>
  <button class="mbtn" id="btnServers">🌐<span>Servidores</span></button>
  <button class="mbtn" id="btnAch">🏆<span>Logros</span></button>
  <button class="mbtn" id="btnHelp">❓<span>Ayuda</span></button>
  <button class="mbtn" id="btnMute">🔊<span>Sonido</span></button>
</div>

<div id="hotbar"></div>
<div id="toasts"></div>
<div id="shade" class="hidden"></div>

<!-- ============ PANELES ============ -->
<div class="panel" id="pShop">
  <div class="awning"></div>
  <div class="shophead">
    <h2>🌱 Nuevas semillas en <b id="stockTimer">3:00</b></h2>
    <button class="btnrestock" id="btnRestock">🔄 RESTOCK</button>
    <button class="pclose" title="Cerrar">✕</button>
  </div>
  <div class="pbody" id="pShopBody"></div>
</div>

<div class="panel" id="pPets">
  <div class="phead"><h2>🐾 Mascotas</h2><button class="pclose">✕</button></div>
  <div class="pbody" id="pPetsBody"></div>
</div>

<div class="panel" id="pQuests">
  <div class="phead"><h2>📜 Misiones</h2><button class="pclose">✕</button></div>
  <div class="pbody" id="pQuestsBody"></div>
</div>

<div class="panel" id="pServers">
  <div class="phead"><h2>🌐 Servidores</h2><button class="pclose">✕</button></div>
  <div class="pbody" id="pServersBody"></div>
</div>

<div class="panel" id="pAch">
  <div class="phead"><h2>🏆 Logros</h2><button class="pclose">✕</button></div>
  <div class="pbody" id="pAchBody"></div>
</div>

<div class="panel" id="pHelp">
  <div class="phead"><h2>❓ Ayuda y ajustes</h2><button class="pclose">✕</button></div>
  <div class="pbody" id="pHelpBody"></div>
</div>

<!-- Modal genérico + aviso de error no bloqueante -->
<div id="modal" class="hidden"></div>
<div id="fatal" class="hidden"><span id="fatalMsg">⚠️</span><button id="fatalClose">✕</button></div>

<script src="game.js"></script>
<!-- Multijugador P2P: PeerJS por CDN + mp.js. Sin internet, el juego sigue en 1 jugador -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="mp.js"></script>
</body>
</html>
