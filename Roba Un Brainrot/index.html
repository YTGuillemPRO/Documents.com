<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>¡Roba el Meme!</title>
<meta name="description" content="Roba memes en 3D, renace y construye tu imperio.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-moneda" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></symbol>
  <symbol id="i-escudo" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/></symbol>
  <symbol id="i-zapato" viewBox="0 0 24 24"><path d="M4 16c5-1 7-6 8-6 2 0 2 3 4 3 3 0 4 2 4 4v1H4z"/></symbol>
  <symbol id="i-guante" viewBox="0 0 24 24"><path d="M8 12V8a2 2 0 0 1 4 0M12 7a2 2 0 0 1 4 0v6a6 6 0 0 1-6 6H9a4 4 0 0 1-4-4v-3a4 4 0 0 1 3-4z"/></symbol>
  <symbol id="i-iman" viewBox="0 0 24 24"><path d="M7 4v7a5 5 0 0 0 10 0V4M7 4h4v4H7zM13 4h4v4h-4z"/></symbol>
  <symbol id="i-expandir" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-tienda" viewBox="0 0 24 24"><path d="M6 8h12l1 12H5zM9 8a3 3 0 0 1 6 0"/></symbol>
  <symbol id="i-ayuda" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 1-1 1.7M12 17h.01"/></symbol>
  <symbol id="i-sonido" viewBox="0 0 24 24"><path d="M4 10v4h3l4 4V6l-4 4H4zM15 9a4 4 0 0 1 0 6M17.5 6.5a8 8 0 0 1 0 11"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
  <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-estrella" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
  <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-corona" viewBox="0 0 24 24"><path d="M3 8l4 4 5-7 5 7 4-4v9H3z"/></symbol>
  <symbol id="i-rayo" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></symbol>
</svg>

<div id="juego"></div>

<div id="cargando"><div class="girando"></div><p>Cargando el mundo…</p></div>

<!-- Menú principal (fondo: el mundo 3D girando) -->
<div id="menu" class="capa menu" hidden>
  <div class="menu-caja">
    <h1 class="logo">¡ROBA<br><em>EL MEME!</em></h1>
    <div class="menu-stats" id="menu-stats"></div>
    <button id="btn-jugar" class="btn jugar">JUGAR</button>
    <button id="btn-como" class="btn">¿Cómo se juega?</button>
    <p class="menu-nota oculto" id="menu-offline"></p>
  </div>
</div>

<canvas id="minimapa" width="156" height="156"></canvas>

<header id="hud">
  <div class="caja-eco">
    <div class="fila-moneda"><svg class="ico"><use href="#i-moneda"/></svg><span id="hud-monedas">0</span></div>
    <div class="sub">
      <span id="hud-ingreso">0/s</span>
      <span id="hud-escudo" class="oculto"><svg class="ico mini"><use href="#i-escudo"/></svg><span id="hud-escudo-t">0s</span></span>
    </div>
    <div class="nivel"><span id="hud-nivel">Nivel 1</span><div class="barra-xp"><div id="hud-xp"></div></div></div>
  </div>
  <div id="chip-evento" class="chip"><svg class="ico"><use href="#i-reloj"/></svg><span id="evento-nombre">Próximo evento</span><b id="evento-tiempo">—</b></div>
  <div id="chip-rango" class="chip rango oculto"><svg class="ico"><use href="#i-corona"/></svg><span id="rango-nombre">Novato</span></div>
  <div id="chip-accion" class="chip accion oculto"></div>
</header>

<nav class="botones-hud">
  <button id="btn-tienda" class="btn-ico" title="Tienda (T)"><svg class="ico"><use href="#i-tienda"/></svg></button>
  <button id="btn-ayuda" class="btn-ico" title="Cómo jugar"><svg class="ico"><use href="#i-ayuda"/></svg></button>
  <button id="btn-sonido" class="btn-ico" title="Sonido"><svg class="ico"><use href="#i-sonido"/></svg></button>
  <button id="btn-reset" class="btn-ico" title="Reiniciar (R)"><svg class="ico"><use href="#i-reset"/></svg></button>
</nav>

<aside id="tienda" aria-label="Tienda">
  <div class="tienda-cab">
    <h2>TIENDA</h2>
    <div class="tienda-pasta"><svg class="ico"><use href="#i-moneda"/></svg><span id="tienda-monedas">0</span></div>
    <button id="cerrar-tienda" class="btn-ico chico" title="Cerrar (Esc)"><svg class="ico"><use href="#i-cerrar"/></svg></button>
  </div>
  <div class="pestanyas">
    <button class="pestanya activa" data-tab="memes">Memes</button>
    <button class="pestanya" data-tab="mejoras">Mejoras</button>
    <button class="pestanya" data-tab="logros">Logros</button>
    <button class="pestanya" data-tab="renacer">Renacer</button>
  </div>
  <div id="lista-memes" class="lista"></div>
  <div id="lista-mejoras" class="lista oculto"></div>
  <div id="lista-logros" class="lista oculto"></div>
  <div id="lista-renacer" class="lista oculto"></div>
</aside>

<div id="capa-modal" class="capa" hidden>
  <div class="modal">
    <h3 id="modal-titulo"></h3>
    <p id="modal-texto"></p>
    <div class="modal-botones">
      <button id="modal-si" class="btn rojo">Sí</button>
      <button id="modal-no" class="btn">No</button>
    </div>
  </div>
</div>

<div id="tutorial" class="capa" hidden>
  <div class="modal tut">
    <div class="tut-ico"><svg class="ico grande"><use id="tut-use" href="#i-zapato"/></svg></div>
    <h3 id="tut-titulo"></h3>
    <p id="tut-texto"></p>
    <button id="tut-btn" class="btn">Siguiente</button>
  </div>
</div>

<div id="toasts"></div>

<div id="joy"><div id="joy-base"><div id="joy-palo"></div></div></div>
<button id="btn-accion" class="btn-accion">ROBAR</button>

<noscript><p style="padding:2rem">Este juego necesita JavaScript.</p></noscript>

<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
